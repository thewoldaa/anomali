<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<title>anomali</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23ff7a9c'/%3E%3Cstop offset='1' stop-color='%23b78cff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Ccircle cx='11' cy='14' r='2.4' fill='%23140e16'/%3E%3Ccircle cx='21' cy='14' r='2.4' fill='%23140e16'/%3E%3Cpath d='M10 20.5c2.2 2.6 9.8 2.6 12 0' stroke='%23140e16' stroke-width='2.2' stroke-linecap='round' fill='none'/%3E%3C/svg%3E" />
<style>
  :root {
    --bg: #0e0a10;
    --surface: #1a1320;
    --surface-2: #241a2d;
    --line: #342441;
    --line-soft: #2a1e33;
    --text: #f4edf5;
    --muted: #a795ae;
    --faint: #6f6178;
    --rose: #ff7a9c;
    --rose-2: #ffa07a;
    --violet: #b78cff;
    --ok: #6ee7a8;
    --radius: 18px;
    --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, "Cascadia Code", "SF Mono", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
  }

  body {
    background:
      radial-gradient(1100px 700px at 85% -10%, rgba(183, 140, 255, 0.12), transparent 60%),
      radial-gradient(900px 600px at 0% 110%, rgba(255, 122, 156, 0.10), transparent 60%),
      var(--bg);
  }

  .app {
    display: flex;
    flex-direction: column;
    height: 100dvh;
    max-width: 860px;
    margin: 0 auto;
  }

  /* ---------------------------------------------------------- header */
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 20px;
    padding-top: max(14px, env(safe-area-inset-top));
    border-bottom: 1px solid var(--line-soft);
    background: color-mix(in srgb, var(--bg) 82%, transparent);
    backdrop-filter: blur(14px);
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .avatar {
    width: 40px; height: 40px;
    border-radius: 13px;
    background: linear-gradient(140deg, var(--rose), var(--violet));
    display: grid; place-items: center;
    font-weight: 700; font-size: 17px;
    color: #170f1a;
    flex: none;
    box-shadow: 0 6px 18px rgba(255, 122, 156, 0.22);
  }

  .who { flex: 1; min-width: 0; }
  .who h1 {
    margin: 0;
    font-size: 16px;
    font-weight: 650;
    letter-spacing: 0.2px;
  }
  .who p {
    margin: 2px 0 0;
    font-size: 12.5px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .who p b { color: var(--rose); font-weight: 600; }

  .mood {
    display: inline-block;
    margin-left: 7px;
    padding: 2px 9px;
    border-radius: 999px;
    border: 1px solid var(--line);
    font-size: 10.5px;
    font-weight: 650;
    letter-spacing: 0.4px;
    vertical-align: 2px;
    transition: color .3s, border-color .3s, background .3s;
  }
  .mood[data-mood="hangat"] { color: #8fe0b0; border-color: rgba(110, 231, 168, .35); background: rgba(110, 231, 168, .1); }
  .mood[data-mood="manja"]  { color: #ff9db4; border-color: rgba(255, 122, 156, .42); background: rgba(255, 122, 156, .1); }
  .mood[data-mood="dingin"] { color: #9fb7d4; border-color: rgba(120, 160, 210, .42); background: rgba(120, 160, 210, .1); }
  .mood[data-mood="nakal"]  { color: #c9a6ff; border-color: rgba(183, 140, 255, .45); background: rgba(183, 140, 255, .12); }

  .icon-btn {
    border: 1px solid var(--line);
    background: transparent;
    color: var(--faint);
    font: inherit;
    font-size: 12.5px;
    padding: 7px 11px;
    border-radius: 10px;
    cursor: pointer;
    transition: color .15s, border-color .15s;
  }
  .icon-btn:hover { color: var(--muted); border-color: var(--line); }

  /* ---------------------------------------------------------- chat */
  main {
    flex: 1;
    overflow-y: auto;
    padding: 24px 20px 12px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    scrollbar-width: thin;
    scrollbar-color: var(--line) transparent;
  }
  main::-webkit-scrollbar { width: 8px; }
  main::-webkit-scrollbar-thumb { background: var(--line); border-radius: 8px; }

  .msg {
    display: flex;
    gap: 10px;
    max-width: 100%;
    animation: pop .25s ease both;
  }
  @keyframes pop {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: none; }
  }

  .msg.bot { align-items: flex-start; }
  .msg.bot .mini {
    width: 28px; height: 28px; flex: none;
    border-radius: 9px;
    background: linear-gradient(140deg, var(--rose), var(--violet));
    display: grid; place-items: center;
    font-size: 12px; font-weight: 700; color: #170f1a;
    margin-top: 2px;
  }

  .bubble {
    padding: 11px 15px;
    border-radius: var(--radius);
    font-size: 15px;
    line-height: 1.55;
    max-width: min(78%, 560px);
    overflow-wrap: anywhere;
  }

  .msg.bot .bubble {
    background: var(--surface);
    border: 1px solid var(--line-soft);
    border-top-left-radius: 6px;
  }

  .msg.user { justify-content: flex-end; }
  .msg.user .bubble {
    background: linear-gradient(140deg, var(--rose), var(--rose-2));
    color: #221018;
    font-weight: 500;
    border-top-right-radius: 6px;
    box-shadow: 0 6px 20px rgba(255, 122, 156, 0.16);
  }

  .msg.system .bubble {
    background: transparent;
    border: 1px dashed var(--line);
    color: var(--muted);
    font-size: 13px;
    max-width: 100%;
  }

  /* jejak berpikir */
  details.think {
    margin-top: 9px;
    border-top: 1px solid var(--line-soft);
    padding-top: 8px;
  }
  details.think summary {
    cursor: pointer;
    font-size: 11.5px;
    letter-spacing: 0.3px;
    color: var(--faint);
    list-style: none;
    user-select: none;
  }
  details.think summary::-webkit-details-marker { display: none; }
  details.think summary::before {
    content: "▸ ";
    color: var(--violet);
  }
  details.think[open] summary::before { content: "▾ "; }
  details.think pre {
    margin: 8px 0 0;
    padding: 10px 12px;
    background: #120c16;
    border: 1px solid var(--line-soft);
    border-radius: 10px;
    font-family: var(--mono);
    font-size: 11.5px;
    line-height: 1.6;
    color: #9d8ba6;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  details.think pre b { color: var(--violet); font-weight: 600; }

  /* typing */
  .typing .bubble {
    display: flex;
    gap: 5px;
    align-items: center;
    padding: 15px 17px;
  }
  .typing i {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--faint);
    animation: blink 1.2s infinite both;
  }
  .typing i:nth-child(2) { animation-delay: .18s; }
  .typing i:nth-child(3) { animation-delay: .36s; }
  @keyframes blink {
    0%, 60%, 100% { opacity: .25; transform: translateY(0); }
    30% { opacity: 1; transform: translateY(-2px); }
  }

  /* saran */
  .suggestions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 4px 2px 8px;
  }
  .suggestions button {
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--muted);
    font: inherit;
    font-size: 13px;
    padding: 8px 13px;
    border-radius: 999px;
    cursor: pointer;
    transition: border-color .15s, color .15s, transform .1s;
  }
  .suggestions button:hover { color: var(--text); border-color: var(--rose); }
  .suggestions button:active { transform: scale(.97); }

  /* ---------------------------------------------------------- composer */
  form {
    padding: 12px 20px calc(16px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--line-soft);
    background: color-mix(in srgb, var(--bg) 85%, transparent);
    backdrop-filter: blur(14px);
  }

  .field {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 22px;
    padding: 7px 7px 7px 18px;
    transition: border-color .18s, box-shadow .18s;
  }
  .field:focus-within {
    border-color: color-mix(in srgb, var(--rose) 55%, var(--line));
    box-shadow: 0 0 0 4px rgba(255, 122, 156, 0.07);
  }

  textarea {
    flex: 1;
    background: transparent;
    border: 0;
    outline: 0;
    resize: none;
    color: var(--text);
    font: inherit;
    font-size: 15px;
    line-height: 1.5;
    max-height: 132px;
    padding: 7px 0;
  }
  textarea::placeholder { color: var(--faint); }

  .send {
    width: 40px; height: 40px;
    flex: none;
    border: 0;
    border-radius: 50%;
    background: linear-gradient(140deg, var(--rose), var(--rose-2));
    color: #221018;
    display: grid; place-items: center;
    cursor: pointer;
    transition: transform .12s, opacity .15s;
  }
  .send:hover { transform: scale(1.05); }
  .send:active { transform: scale(.94); }
  .send:disabled { opacity: .45; cursor: default; transform: none; }
  .send svg { width: 18px; height: 18px; }

  .hint {
    text-align: center;
    font-size: 11px;
    color: var(--faint);
    margin: 8px 0 0;
  }

  @media (max-width: 560px) {
    main { padding: 18px 14px 10px; }
    header { padding: 12px 14px; padding-top: max(12px, env(safe-area-inset-top)); }
    form { padding: 10px 14px calc(14px + env(safe-area-inset-bottom)); }
    .bubble { max-width: 84%; font-size: 14.5px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="avatar">a</div>
    <div class="who">
      <h1>anomali <span id="mood" class="mood" data-mood="hangat">hangat</span></h1>
      <p id="status">menghubungkan…</p>
    </div>
    <button class="icon-btn" id="reset" title="hapus ingatan">&larr; lupakan</button>
  </header>

  <main id="chat" aria-live="polite"></main>

  <form id="form">
    <div class="field">
      <textarea id="input" rows="1" placeholder="tulis sesuatu…" autocomplete="off" spellcheck="false"></textarea>
      <button class="send" id="send" type="submit" aria-label="kirim">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 12h12M13 6l6 6-6 6" />
        </svg>
      </button>
    </div>
    <p class="hint">semua obrolan &amp; ingatan tersimpan di komputer kamu sendiri</p>
  </form>
</div>

<script>
(() => {
  "use strict";

  const USER_KEY = "anomali.user";
  const user = localStorage.getItem(USER_KEY) || "web";
  localStorage.setItem(USER_KEY, user);

  const chat = document.getElementById("chat");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("send");
  const statusEl = document.getElementById("status");
  const moodEl = document.getElementById("mood");
  const resetBtn = document.getElementById("reset");

  let busy = false;
  let greeted = false;

  const esc = (s) => String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");

  function scrollDown() {
    requestAnimationFrame(() => {
      chat.scrollTop = chat.scrollHeight;
    });
  }

  function addUser(text) {
    const el = document.createElement("div");
    el.className = "msg user";
    el.innerHTML = `<div class="bubble">${esc(text)}</div>`;
    chat.appendChild(el);
    scrollDown();
  }

  function setMood(key, label) {
    if (!key || !moodEl) return;
    moodEl.dataset.mood = key;
    moodEl.textContent = label || key;
  }

  const MODE_LABEL = { yakin: "yakin", menebak: "menebak", bingung: "belum paham" };

  function addBot(reply) {
    const el = document.createElement("div");
    el.className = "msg bot";

    const pct = Math.round((reply.confidence || 0) * 100);
    const moodBit = reply.mood?.label ? ` · ${esc(reply.mood.label)}` : "";
    const summary = `${MODE_LABEL[reply.think?.mode] || "tebakan"} · ${esc(reply.intentLabel || reply.intentSlug)}${moodBit} · ${pct}%`;
    const body = (reply.think?.lines || []).map((l) => esc(l)).join("\n");

    el.innerHTML =
      `<div class="mini">a</div>` +
      `<div class="bubble">` +
        `<div class="text">${esc(reply.text)}</div>` +
        `<details class="think"><summary>jejak tebakan — ${summary}</summary><pre>${body}</pre></details>` +
      `</div>`;
    chat.appendChild(el);
    scrollDown();
  }

  function addSystem(text) {
    const el = document.createElement("div");
    el.className = "msg system";
    el.innerHTML = `<div class="bubble">${esc(text)}</div>`;
    chat.appendChild(el);
    scrollDown();
  }

  function showTyping() {
    const el = document.createElement("div");
    el.className = "msg bot typing";
    el.id = "typing";
    el.innerHTML = `<div class="mini">a</div><div class="bubble"><i></i><i></i><i></i></div>`;
    chat.appendChild(el);
    scrollDown();
  }

  function hideTyping() {
    document.getElementById("typing")?.remove();
  }

  async function refreshProfile() {
    try {
      const res = await fetch(`/api/profile?user=${encodeURIComponent(user)}`);
      if (!res.ok) throw new Error("profil gagal");
      const p = await res.json();
      if (p.mood) setMood(p.mood.key, p.mood.label);
      const name = (p.facts || []).find((f) => f.key === "name")?.value;
      if (name) {
        statusEl.innerHTML = `ingat kamu, <b>${esc(name)}</b> · ${p.turns || 0} pesan`;
      } else {
        statusEl.textContent = "belum kenal nama kamu — bilang “namaku …”";
      }
      return name || null;
    } catch {
      statusEl.textContent = "server tidak merespons";
      return null;
    }
  }

  async function send(text) {
    if (busy || !text.trim()) return;
    busy = true;
    sendBtn.disabled = true;

    addUser(text);
    input.value = "";
    autoGrow();
    showTyping();

    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ user, message: text }),
      });
      if (!res.ok) throw new Error(`server ${res.status}`);
      const reply = await res.json();
      hideTyping();
      addBot(reply);
      if (reply.mood) setMood(reply.mood.key, reply.mood.label);
      if (reply.savedName) refreshProfile();
    } catch (err) {
      hideTyping();
      addSystem("koneksi putus: " + err.message);
    } finally {
      busy = false;
      sendBtn.disabled = false;
      input.focus();
    }
  }

  function autoGrow() {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 132) + "px";
  }

  input.addEventListener("input", autoGrow);
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      form.requestSubmit();
    }
  });

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    send(input.value);
  });

  resetBtn.addEventListener("click", async () => {
    if (!confirm("Hapus semua ingatan tentang kamu? Ini permanen.")) return;
    try {
      const res = await fetch("/api/reset", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ user }),
      });
      if (!res.ok) throw new Error("gagal");
      const data = await res.json();
      chat.innerHTML = "";
      greeting();
      addSystem(`${data.removed} ingatan dihapus. kita mulai dari nol.`);
      refreshProfile();
    } catch {
      addSystem("gagal menghapus ingatan.");
    }
  });

  function greeting() {
    if (greeted) return;
    greeted = true;
    const wrap = document.createElement("div");
    wrap.className = "suggestions";
    ["hai", "namaku craftkal", "aku kangen kamu", "coba tebak aku lagi apa", "namaku siapa"].forEach((s) => {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = s;
      b.addEventListener("click", () => send(s));
      wrap.appendChild(b);
    });
    chat.appendChild(wrap);
  }

  (async () => {
    const name = await refreshProfile();
    if (name) addSystem(`halo lagi, ${name}. aku masih ingat kamu.`);
    greeting();
    input.focus();
  })();
})();
</script>
</body>
</html>
